# fly.toml

app = "perpx-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true

  # Allow the machine to sleep when idle
  auto_stop_machines = "suspend"
  auto_start_machines = true

  # Don't keep any machine running continuously
  min_machines_running = 0

  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  ports = []
  processes = ["app"]

  [services.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

[checks]
  [checks.health]
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/markets"

[[vm]]
  cpu_kind = "shared"
  cpus = 1

  # Reduce RAM to the minimum your app comfortably needs.
  # Increase this if your app runs out of memory.
  memory = "256mb"